spring.application.name=support

# === PostgreSQL Configuration ===
#spring.datasource.url=jdbc:postgresql://localhost:5432/supportpg
#spring.datasource.url=jdbc:postgresql://supportpg.cvmo6u4wii86.ap-south-1.rds.amazonaws.com:5432/supportpg
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/supportpg
spring.datasource.username=postgres
spring.datasource.password=Postgres123

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === File Upload Limits ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# === Jackson (Optional, to avoid serialization errors) ===
spring.jackson.serialization.fail-on-empty-beans=false

jwt.secret=MySuperSecretKey12345678901234567890
# 1 day in milliseconds
jwt.expiration=86400000

management.metrics.export.enabled=false





